schema_version: 1

context:
  name: janus
  version: "2.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: da6197870a8c634fed91698b5fd9725c33b83cb693baabf264320d7773e53659

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.13.8,<0.14
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - janus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Mixed sync-async queue to interoperate between asyncio tasks and classic threads
  homepage: https://github.com/aio-libs/janus/

extra:
  recipe-maintainers:
    - epruesse
    - thewchan
